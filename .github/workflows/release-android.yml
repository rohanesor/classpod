name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build Next.js Web Static Export
        run: npm run build --workspace=@classpod/web

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/web/android/gradlew

      - name: Build Release APK
        run: |
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpod-release-apk
          path: apps/web/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apps/web/android/app/build/outputs/apk/release/app-release.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build Next.js Web Static Export
        run: npm run build --workspace=@classpod/web

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/web/android/gradlew

      - name: Ensure Release Keystore
        run: |
          if [ ! -f apps/web/android/app/classpod-release-key.jks ]; then
            keytool -genkey -v -keystore apps/web/android/app/classpod-release-key.jks -alias classpod-release-key -keyalg RSA -keysize 2048 -validity 10000 -storepass classpod123 -keypass classpod123 -dname "CN=ClassPod, OU=Engineering, O=ClassPod Inc, L=Bangalore, ST=Karnataka, C=IN"
          fi

      - name: Build Release APK
        run: |
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpod-release-apk
          path: apps/web/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/web/android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

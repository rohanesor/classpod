name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-aws:
    name: Build, ECR Push & ECS Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/classpod-api:latest
            ${{ steps.login-ecr.outputs.registry }}/classpod-api:${{ github.sha }}

      - name: Build & Push Worker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/classpod-worker:latest
            ${{ steps.login-ecr.outputs.registry }}/classpod-worker:${{ github.sha }}

      - name: Build & Push AI Detection Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-detection
          file: apps/ai-detection/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/classpod-ai-detection:latest
            ${{ steps.login-ecr.outputs.registry }}/classpod-ai-detection:${{ github.sha }}

      - name: Execute Prisma Database Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Deploy API Service to AWS ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: infra/aws/ecs.tf
          service: classpod-api-service
          cluster: classpod-cluster-production
          wait-for-service-stability: true

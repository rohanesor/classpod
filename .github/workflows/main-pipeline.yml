name: ClassPod Complete CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Lint
  lint:
    name: 1. Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Stage 2: Typecheck
  typecheck:
    name: 2. Typecheck
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Typecheck NestJS API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Typecheck Next.js Web Client
        run: npx tsc --noEmit -p apps/web/tsconfig.json

  # Stage 3: Tests
  tests:
    name: 3. Run Tests
    needs: [typecheck]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classpod_test
          POSTGRES_USER: classpod
          POSTGRES_PASSWORD: classpod_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Push Test Database Schema
        env:
          DATABASE_URL: postgresql://classpod:classpod_password@localhost:5432/classpod_test?schema=public
        run: npx prisma db push --schema apps/api/prisma/schema.prisma

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://classpod:classpod_password@localhost:5432/classpod_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-jwt-key-minimum-32-chars-long
          GATEWAY_SHARED_SECRET: local-dev-secret-key
        run: npm test --if-present

  # Stage 4: Build
  build:
    name: 4. Build Monorepo Bundles
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build NestJS API
        run: npm run build --workspace=@classpod/api

      - name: Build Next.js Web Static Export
        run: npm run build --workspace=@classpod/web

  # Stage 5: Docker Build
  docker-build:
    name: 5. Docker Container Builds
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: classpod-api:latest

      - name: Build Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.worker
          push: false
          tags: classpod-worker:latest

      - name: Build AI Detection Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-detection
          file: ./apps/ai-detection/Dockerfile
          push: false
          tags: classpod-ai-detection:latest

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: classpod-web:latest

  # Stage 6: Artifact Upload
  artifact:
    name: 6. Upload Web Build Artifact
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build Static Export
        run: npm run build --workspace=@classpod/web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpod-web-static-export
          path: apps/web/out
          retention-days: 14

  # Stage 7: Release APK
  release-apk:
    name: 7. Build Release Android APK
    needs: [artifact]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build Next.js Web Static Export
        run: npm run build --workspace=@classpod/web

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/web/android/gradlew

      - name: Build Release APK
        run: |
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpod-release-apk
          path: apps/web/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # Stage 8: Prepare AWS Deployment
  prepare-aws-deployment:
    name: 8. Prepare AWS EC2 / ECS Deployment
    needs: [release-apk]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log Deployment Preparation Summary
        run: |
          echo "=========================================="
          echo "ClassPod CI/CD Pipeline Completed Successfully"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ready for AWS EC2 SSH / ECS Container Deployment"
          echo "=========================================="

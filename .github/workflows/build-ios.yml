name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Patch BluetoothLe Plugin for Capacitor 8 Swift SPM
        run: |
          python3 scripts/patch_plugin.py node_modules/@capacitor-community/bluetooth-le/ios/Sources/BluetoothLe/Plugin.swift

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build Next.js Web Static Export
        run: npm run build --workspace=@classpod/web

      - name: Setup Local Workspace Modules & Sync Capacitor
        run: |
          cd apps/web
          mkdir -p node_modules/@capacitor-community
          cp -r ../../node_modules/@capacitor-community/bluetooth-le node_modules/@capacitor-community/
          python3 ../../scripts/patch_plugin.py node_modules/@capacitor-community/bluetooth-le/ios/Sources/BluetoothLe/Plugin.swift
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd apps/web/ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package App into IPA
        run: |
          cd apps/web/ios/App
          mkdir -p build/Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -q ClassPod.ipa Payload
          echo "ClassPod.ipa created successfully!"
          ls -lh ClassPod.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpod-release-ipa
          path: apps/web/ios/App/build/ClassPod.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }}
          files: apps/web/ios/App/build/ClassPod.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

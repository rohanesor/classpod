name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@classpod/shared

      - name: Build Next.js Web Static Export
        run: npm run build --workspace=@classpod/web

      - name: Sync Capacitor iOS
        run: |
          cd apps/web
          npx cap sync ios

      - name: Resolve Swift Packages
        run: |
          cd apps/web/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build iOS App with Xcode
        run: |
          cd apps/web/ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into IPA
        run: |
          cd apps/web/ios/App
          mkdir -p build/Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build directory!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -q ClassPod.ipa Payload
          echo "ClassPod.ipa created successfully!"
          ls -lh ClassPod.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classpod-release-ipa
          path: apps/web/ios/App/build/ClassPod.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/web/ios/App/build/ClassPod.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
